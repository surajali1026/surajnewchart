<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181b24"/>
      <stop offset="100%" stop-color="#0e1118"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2962ff"/>
      <stop offset="100%" stop-color="#0039cb"/>
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#089981"/>
      <stop offset="100%" stop-color="#067361"/>
    </linearGradient>
    <linearGradient id="redG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f23645"/>
      <stop offset="100%" stop-color="#b81d2a"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle with glow border -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#accent)" stroke-width="6" opacity="0.6"/>

  <!-- Candlestick 1: Bullish Green -->
  <line x1="150" y1="130" x2="150" y2="390" stroke="#089981" stroke-width="10" stroke-linecap="round"/>
  <rect x="126" y="200" width="48" height="130" rx="8" fill="url(#greenG)"/>

  <!-- Candlestick 2: Bearish Red -->
  <line x1="256" y1="90" x2="256" y2="430" stroke="#f23645" stroke-width="10" stroke-linecap="round"/>
  <rect x="232" y="160" width="48" height="180" rx="8" fill="url(#redG)"/>

  <!-- Candlestick 3: Bullish Green -->
  <line x1="362" y1="70" x2="362" y2="370" stroke="#089981" stroke-width="10" stroke-linecap="round"/>
  <rect x="338" y="110" width="48" height="190" rx="8" fill="url(#greenG)"/>

  <!-- Indicator Trend Line -->
  <path d="M 100 370 Q 220 340 280 230 T 420 130" fill="none" stroke="#2962ff" stroke-width="12" stroke-linecap="round"/>
  <circle cx="420" cy="130" r="14" fill="#2962ff" stroke="#ffffff" stroke-width="4"/>

  <!-- USD-M Pill Tag -->
  <rect x="176" y="420" width="160" height="42" rx="21" fill="#2962ff"/>
  <text x="256" y="448" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="#ffffff" letter-spacing="2">USD-M</text>
</svg>
